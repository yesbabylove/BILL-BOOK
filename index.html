/* --- WebView & Browser Compatible Direct Download (Uses Data URI for Android WebView compatibility) --- */
function blobToDataURL(blob){
  return new Promise((ok,no)=>{
    const r=new FileReader();
    r.onload=()=>ok(r.result);
    r.onerror=no;
    r.readAsDataURL(blob);
  });
}
async function dl(n,s){
  try{
    const blob=s instanceof Blob?s:new Blob([s],{type:n.endsWith('.json')?'application/json':n.endsWith('.csv')?'text/csv;charset=utf-8':n.endsWith('.zip')?'application/zip':'text/html;charset=utf-8'});
    const dataUrl=await blobToDataURL(blob);
    const a=document.createElement('a');
    a.href=dataUrl;
    a.download=n;
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>a.remove(),1500);
    return dataUrl;
  }catch(x){
    toast('Download error: '+(x.message||'failed'));
    return false;
  }
}

async function pdfDataOf(id){
  const d=C().docs.find(x=>x.id==id),src=$('.inv');
  if(!src||!d)return null;
  if(!window.html2canvas||!window.jspdf){
    toast('PDF tool loading... Check internet once.');
    return null;
  }
  toast('Creating PDF, please wait...');
  const w=document.createElement('div');
  w.style.cssText='position:fixed;left:0;top:0;width:740px;background:#fff;z-index:-1;pointer-events:none';
  const k=src.cloneNode(true);k.style.transform='none';k.style.position='relative';
  w.appendChild(k);document.body.appendChild(w);
  try{
    const cv=await html2canvas(k,{scale:2,backgroundColor:'#fff',useCORS:true,width:740,height:k.offsetHeight,windowWidth:740,windowHeight:k.offsetHeight,x:0,y:0,scrollX:0,scrollY:0});
    const pdf=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    const m=10,aw=210-2*m,ah=297-2*m;
    let iw=aw,ih=aw*cv.height/cv.width;
    if(ih>ah){ih=ah;iw=ah*cv.width/cv.height;}
    pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',m+(aw-iw)/2,m,iw,ih);
    return {
      dataUri: pdf.output('datauristring'),
      blob: pdf.output('blob'),
      imgUri: cv.toDataURL('image/png')
    };
  }catch(x){
    toast('Could not generate PDF.');
    return null;
  }finally{w.remove();}
}
